<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feliz cumpleaños 🌷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<meta name="theme-color" content="#141927">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E6ECF2;
    --bg-2: #F1CFD2;
    --ink: #1D2230;
    --ink-soft: #545C6E;
    --asphalt: #2E3340;
    --lamp-off: #3A3F4C;
    --lamp-on: #FF2B2B;
    --paper: #FFF8EF;
    --paper-ink: #2B2420;
    --accent: #D7263D;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141927;
      --bg-2: #4A1520;
      --ink: #F3F1EC;
      --ink-soft: #A9B0C2;
      --asphalt: #0E121C;
      --lamp-off: #2A3040;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141927;
    --bg-2: #4A1520;
    --ink: #F3F1EC;
    --ink-soft: #A9B0C2;
    --asphalt: #0E121C;
    --lamp-off: #2A3040;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    background: radial-gradient(120% 80% at 50% 100%, var(--bg-2), var(--bg) 70%);
    background-color: var(--bg);
    color: var(--ink);
    font-family: "Titillium Web", "Helvetica Neue", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  main {
    height: 100%;
    display: grid;
    place-items: center;
    padding: 1.25rem;
    text-align: center;
  }

  /* ---------- Fase 1: semáforo ---------- */
  .start {
    display: grid;
    gap: 1.75rem;
    justify-items: center;
    transition: opacity .6s ease, transform .6s ease;
  }
  .start h1 {
    font-weight: 900;
    font-size: clamp(2rem, 9vw, 3.2rem);
    line-height: 1;
    letter-spacing: -0.01em;
    font-style: italic;
  }
  .start p { color: var(--ink-soft); font-size: 1.05rem; max-width: 22rem; }
  .gantry {
    display: flex;
    gap: clamp(.4rem, 2vw, .7rem);
    padding: .8rem;
    background: var(--asphalt);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .pod {
    display: grid;
    gap: .45rem;
    padding: .45rem;
    background: #050608;
    border-radius: 10px;
  }
  .lamp {
    width: clamp(28px, 9vw, 42px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--lamp-off);
    transition: background .08s linear, box-shadow .08s linear;
  }
  .pod.on .lamp {
    background: var(--lamp-on);
    box-shadow: 0 0 14px 3px rgba(255,43,43,.75), inset 0 -4px 8px rgba(0,0,0,.25);
  }
  .go {
    font: inherit;
    font-weight: 700;
    font-size: 1.15rem;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 999px;
    padding: .85rem 2.2rem;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(215,38,61,.35);
  }
  .go:focus-visible, .bouquet:focus-visible, .close:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 4px;
  }
  .status { min-height: 1.6em; font-weight: 700; font-size: 1.2rem; }
  .start.leaving { opacity: 0; transform: translateY(-30px) scale(.96); pointer-events: none; }

  /* Carro que pasa al apagarse las luces */
  .car-zoom {
    position: fixed;
    left: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 10%);
    width: min(72vw, 340px);
    transform: translateX(-110%);
    pointer-events: none;
    z-index: 5;
  }
  .car-zoom.go-car { animation: zoom 1.1s cubic-bezier(.55,0,.85,.55) forwards; }
  @keyframes zoom { to { transform: translateX(100vw); } }

  /* Iconos bajo el ramo */
  .icons {
    display: flex;
    gap: 1.1rem;
    justify-content: center;
    align-items: center;
    margin-top: .3rem;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .6s ease 3s, transform .6s ease 3s;
  }
  .show .icons { opacity: 1; transform: none; }
  .icons svg { width: 50px; height: 50px; display: block; filter: drop-shadow(0 3px 4px rgba(0,0,0,.25)); }
  .icons .car-mini { width: 120px; height: 34px; }

  /* ---------- Fase 2: ramo ---------- */
  .bouquet-wrap {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1rem);
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
  }
  .bouquet-wrap.show { opacity: 1; pointer-events: auto; }
  .bouquet-inner { display: grid; justify-items: center; gap: .5rem; }
  .bouquet {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    border-radius: 20px;
  }
  .bouquet svg {
    width: min(82vw, 380px);
    height: auto;
    max-height: 72vh;
    display: block;
    overflow: visible;
  }
  .hint {
    color: var(--ink-soft);
    font-size: 1.05rem;
    opacity: 0;
    transition: opacity .6s ease 2.6s;
  }
  .show .hint { opacity: 1; }
  .bday {
    font-weight: 900;
    font-style: italic;
    font-size: clamp(1.9rem, 8.5vw, 3rem);
    line-height: 1;
    letter-spacing: -0.01em;
    opacity: 0;
    transform: translateY(-12px);
    transition: opacity .6s ease 1.8s, transform .6s ease 1.8s;
  }
  .show .bday { opacity: 1; transform: none; }

  .stem {
    fill: none;
    stroke: #3E8E4A;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
  }
  .leaf { fill: #4FA45C; transform-box: fill-box; transform-origin: center bottom; transform: scale(0); }
  .head { transform-box: fill-box; transform-origin: center bottom; transform: scale(0); }
  .show .stem { animation: draw 1.1s cubic-bezier(.3,.7,.3,1) forwards; animation-delay: var(--d); }
  .show .leaf { animation: pop .6s cubic-bezier(.3,1.5,.5,1) forwards; animation-delay: calc(var(--d) + .7s); }
  .show .head { animation: pop .7s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: calc(var(--d) + .9s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { transform: scale(1); } }

  .wrap-paper { opacity: 0; transform: translateY(20px); transition: opacity .6s ease .2s, transform .6s ease .2s; }
  .show .wrap-paper { opacity: 1; transform: none; }

  /* ---------- Carta ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,20,.55);
    display: grid;
    place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 1rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1rem);
    opacity: 0;
    pointer-events: none;
    transition: opacity .35s ease;
    z-index: 20;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .letter {
    position: relative;
    width: min(100%, 26rem);
    max-height: 100%;
    overflow-y: auto;
    background: var(--paper);
    color: var(--paper-ink);
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
    text-align: left;
    transform: translateY(60px) rotate(-3deg) scale(.92);
    transition: transform .55s cubic-bezier(.2,1.2,.4,1);
    -webkit-overflow-scrolling: touch;
  }
  .overlay.open .letter { transform: none; }
  .flag {
    height: 22px;
    background: repeating-conic-gradient(#1D2230 0 25%, #FFF8EF 0 50%) 0 0 / 22px 22px;
    border-radius: 6px 6px 0 0;
    border-bottom: 7px solid #C8102E;
    box-shadow: 0 3px 0 #F2C200;
  }
  .letter-body {
    padding: 1.6rem 1.5rem 1.8rem;
    font-family: "Caveat", "Bradley Hand", "Segoe Script", cursive;
    font-size: 1.45rem;
    line-height: 1.35;
  }
  .letter-body p + p { margin-top: .8rem; }
  .letter-body .sign { margin-top: 1.4rem; text-align: right; font-weight: 700; }
  .close {
    display: block;
    margin: 0 auto 1.4rem;
    font: inherit;
    font-family: "Titillium Web", "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 1rem;
    background: #1D2230;
    color: #FFF8EF;
    border: 0;
    border-radius: 999px;
    padding: .6rem 1.6rem;
    cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
  }
</style>
</head>
<body>
<main>
  <section class="start" id="start">
    <h1>Tengo algo para ti</h1>
    <div class="gantry" aria-hidden="true">
      <div class="pod"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="pod"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="pod"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="pod"><div class="lamp"></div><div class="lamp"></div></div>
      <div class="pod"><div class="lamp"></div><div class="lamp"></div></div>
    </div>
    <p class="status" id="status" aria-live="polite">Cuando estés lista, arranca.</p>
    <button class="go" id="go" type="button">Arrancar</button>
  </section>

  <section class="bouquet-wrap" id="stage" aria-hidden="true">
    <div class="bouquet-inner">
      <h2 class="bday">¡Feliz cumpleaños!</h2>
      <button class="bouquet" id="bouquet" type="button" aria-label="Abrir la carta">
        <svg viewBox="0 0 400 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ramo de tulipanes envuelto en papel a cuadros">
          <defs>
            <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
              <rect width="24" height="24" fill="#FAFAF7"/>
              <rect width="12" height="12" fill="#1D2230"/>
              <rect x="12" y="12" width="12" height="12" fill="#1D2230"/>
            </pattern>
            <linearGradient id="shade" x1="0" x2="1">
              <stop offset="0" stop-color="#000" stop-opacity=".18"/>
              <stop offset=".5" stop-color="#000" stop-opacity="0"/>
              <stop offset="1" stop-color="#000" stop-opacity=".22"/>
            </linearGradient>
          </defs>

          <!-- papel trasero -->
          <path class="wrap-paper" d="M70 292 Q200 250 330 292 L212 548 L188 548 Z" fill="#E9E4DA"/>

          <!-- tallos -->
          <g id="stems"></g>
          <!-- tulipanes -->
          <g id="heads"></g>

          <!-- papel delantero a cuadros -->
          <g class="wrap-paper">
            <path d="M104 318 Q200 345 296 318 L210 548 L190 548 Z" fill="url(#checks)"/>
            <path d="M104 318 Q200 345 296 318 L210 548 L190 548 Z" fill="url(#shade)"/>
            <path d="M104 318 Q200 345 296 318" fill="none" stroke="#1D2230" stroke-width="3"/>
            <!-- moño -->
            <path d="M200 430 C170 400 140 410 150 432 C158 448 185 440 200 430 Z" fill="#F2C200"/>
            <path d="M200 430 C230 400 260 410 250 432 C242 448 215 440 200 430 Z" fill="#F2C200"/>
            <path d="M196 432 L178 480 L190 476 L198 488 Z" fill="#D49A00"/>
            <path d="M204 432 L222 480 L210 476 L202 488 Z" fill="#D49A00"/>
            <circle cx="200" cy="431" r="9" fill="#D49A00"/>
          </g>
        </svg>
      </button>
      <p class="hint">Toca el ramo</p>
      <div class="icons" aria-hidden="true">
        <!-- casco -->
        <svg viewBox="0 0 48 48">
          <path d="M5 31 C5 14 17 5 29 5 C41 5 45 15 45 25 L45 34 Q45 37 42 37 L16 38 C9 38 5 35 5 31 Z" fill="url(#g-red)"/>
          <path d="M7 27 C16 25 32 27 45 28 L45 31 C32 30 16 29 6 31 Z" fill="#F2C200"/>
          <path d="M7 32 C16 31 32 32 45 33" fill="none" stroke="#fff" stroke-width="1.3"/>
          <path d="M22 15 L43 15 Q46 20 44 24 L24 24 Q20 20 22 15 Z" fill="url(#g-visor)"/>
          <path d="M26 17 L38 17" stroke="#fff" stroke-opacity=".55" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 14 Q18 8 26 7" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- auto -->
        <svg class="car-mini" viewBox="0 0 240 64"><use href="#car-shape"/></svg>
        <!-- copa -->
        <svg viewBox="0 0 48 48">
          <path d="M14 11 H7 C7 20 11 23 16 23 M34 11 H41 C41 20 37 23 32 23" fill="none" stroke="url(#g-gold)" stroke-width="3" stroke-linecap="round"/>
          <path d="M13 5 H35 V16 C35 25 29.5 30 24 30 C18.5 30 13 25 13 16 Z" fill="url(#g-gold)"/>
          <path d="M17 8 V17 C17 21 19 24 21 25" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
          <path d="M24 11 l2 4 4.4 .6 -3.2 3 .8 4.4 -4 -2.1 -4 2.1 .8 -4.4 -3.2 -3 4.4 -.6 Z" fill="#C8102E"/>
          <path d="M21 30 H27 L26 36 H22 Z" fill="url(#g-gold)"/>
          <rect x="14" y="36" width="20" height="7" rx="1.5" fill="url(#g-dark)"/>
          <rect x="18" y="38.5" width="12" height="2" rx="1" fill="#F2C200"/>
        </svg>
        <!-- llanta blanda -->
        <svg viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="21" fill="url(#g-tire)"/>
          <circle cx="24" cy="24" r="21" fill="none" stroke="#000" stroke-opacity=".4" stroke-width="1"/>
          <circle cx="24" cy="24" r="16" fill="none" stroke="#E10600" stroke-width="2.6"/>
          <circle cx="24" cy="24" r="11.5" fill="url(#g-rim)"/>
          <g stroke="#3A3E48" stroke-width="1.6"><path d="M24 13.5 V34.5 M13.5 24 H34.5 M16.6 16.6 L31.4 31.4 M31.4 16.6 L16.6 31.4"/></g>
          <circle cx="24" cy="24" r="4" fill="#C8102E"/>
          <circle cx="24" cy="24" r="1.5" fill="#F2C200"/>
          <path d="M8 18 A17 17 0 0 1 20 7" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </section>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A5A"/><stop offset=".45" stop-color="#D0122F"/><stop offset="1" stop-color="#7A0816"/>
    </linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3E48"/><stop offset="1" stop-color="#0E1015"/>
    </linearGradient>
    <radialGradient id="g-tire" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#4A4E58"/><stop offset=".7" stop-color="#1B1D23"/><stop offset="1" stop-color="#08090C"/>
    </radialGradient>
    <radialGradient id="g-rim" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#EEF1F6"/><stop offset=".6" stop-color="#9AA0AD"/><stop offset="1" stop-color="#4C515D"/>
    </radialGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF0A0"/><stop offset=".35" stop-color="#FFD21F"/><stop offset=".75" stop-color="#E2A800"/><stop offset="1" stop-color="#9C6C00"/>
    </linearGradient>
    <linearGradient id="g-visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6E96"/><stop offset=".5" stop-color="#1A2236"/><stop offset="1" stop-color="#05070C"/>
    </linearGradient>
    <g id="wheel-rear">
      <circle r="16" fill="url(#g-tire)"/>
      <circle r="12.5" fill="none" stroke="#E10600" stroke-width="1.8"/>
      <circle r="9" fill="url(#g-rim)"/>
      <g stroke="#3A3E48" stroke-width="1.4"><path d="M0 -8 V8 M-8 0 H8 M-5.6 -5.6 L5.6 5.6 M5.6 -5.6 L-5.6 5.6"/></g>
      <circle r="2.6" fill="#C8102E"/>
      <path d="M-11 -9 A14 14 0 0 1 4 -14" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="car-shape">
      <!-- sombra -->
      <ellipse cx="124" cy="61" rx="112" ry="3" fill="#000" opacity=".22"/>
      <!-- alerón trasero -->
      <rect x="6" y="6" width="6" height="34" rx="1" fill="url(#g-dark)"/>
      <path d="M2 7 L34 5 L34 10 L2 12 Z" fill="url(#g-red)"/>
      <path d="M4 14 L32 13 L32 17 L4 18 Z" fill="#8E0A1C"/>
      <rect x="20" y="17" width="3" height="16" fill="#1B1D23"/>
      <!-- piso -->
      <path d="M26 47 L222 46 L222 50 L26 51 Z" fill="#111318"/>
      <!-- carrocería -->
      <path d="M20 46 L24 33 L62 29 L100 23 L110 11 Q118 7 126 11 L134 22 L156 26 L186 30 L214 36 L236 42 L238 47 Z" fill="url(#g-red)"/>
      <!-- pontones -->
      <path d="M66 44 L68 35 Q104 30 146 32 Q156 36 160 44 Z" fill="#A50D25"/>
      <path d="M68 38 Q108 34 154 37" fill="none" stroke="#F2C200" stroke-width="2.6"/>
      <path d="M70 41 Q108 38 156 41" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"/>
      <!-- toma de aire -->
      <path d="M112 14 Q118 10 124 14 L122 18 L114 18 Z" fill="#111318"/>
      <!-- brillo superior -->
      <path d="M30 33 L64 30 L100 25 M136 24 L186 31 L214 37" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.3" stroke-linecap="round"/>
      <!-- piloto y halo -->
      <circle cx="144" cy="22" r="6.5" fill="#F2C200"/>
      <path d="M144 19 h6 a2 2 0 0 1 0 4 h-6 Z" fill="url(#g-visor)"/>
      <path d="M128 25 Q140 11 162 27" fill="none" stroke="#22252D" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M151 16 L150 26" stroke="#22252D" stroke-width="2.6" stroke-linecap="round"/>
      <!-- alerones delanteros -->
      <path d="M204 44 L240 43 L240 47 L204 48 Z" fill="#8E0A1C"/>
      <rect x="234" y="36" width="4" height="12" rx="1" fill="url(#g-dark)"/>
      <!-- ruedas -->
      <use href="#wheel-rear" transform="translate(52 46)"/>
      <use href="#wheel-rear" transform="translate(192 47) scale(.88)"/>
    </g>
  </defs>
</svg>
<svg class="car-zoom" id="car" viewBox="0 0 240 64" aria-hidden="true"><use href="#car-shape"/></svg>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="letter-start">
  <article class="letter">
    <div class="flag" aria-hidden="true"></div>
    <div class="letter-body" id="letter-body"></div>
    <button class="close" id="close" type="button">Cerrar carta</button>
  </article>
</div>

<script>
  /* ====== Edita aquí el texto de la carta ====== */
  const CARTA = {
    saludo: "Feliz cumpleaños, Camii:",
    parrafos: [
      "De verdad, gracias por dejarme estar en tu vida y por permitirme compartir un cumpleaños más a tu lado. No te imaginas el cariño tan grande que te tengo. Sé que hemos pasado por muchas cosas, pero aun así hemos salido adelante.",
      "También quiero recordarte que eres una mujer increíble, fuerte, y que vales muchísimo. Estoy muy orgulloso de todo lo que logras día a día, y siempre voy a celebrar cada uno de tus éxitos y cada meta que consigas.",
      "Espero que disfrutes muchísimo este día. Sé que hay días difíciles, pero también sé que todo tendrá su recompensa, porque tú siempre sigues ahí y luchas cada día. Nunca dejes de ver lo bueno.",
      "Por último, quiero que sepas que siempre vas a contar con mi apoyo en todo. Nunca dudes en decírmelo cuando me necesites, porque siempre voy a estar ahí para ti. Tú eres uno de mis mayores apoyos y yo también quiero serlo para ti, para que nunca te sientas sola.",
      "Te mando un súper abrazo. Recuerda que te amo, señorita, y que espero seguir compartiendo muchos cumpleaños más a tu lado.",
    ],
    firma: "Att: tu mejor amigo",
  };
  /* ============================================= */

  const body = document.getElementById("letter-body");
  const h = document.createElement("p");
  h.id = "letter-start";
  h.textContent = CARTA.saludo;
  body.appendChild(h);
  CARTA.parrafos.forEach(t => { const p = document.createElement("p"); p.textContent = t; body.appendChild(p); });
  const s = document.createElement("p");
  s.className = "sign";
  s.style.whiteSpace = "pre-line";
  s.textContent = CARTA.firma;
  body.appendChild(s);

  // Construir tulipanes
  const NS = "http://www.w3.org/2000/svg";
  const base = { x: 200, y: 430 };
  const colores = [
    ["#C8102E", "#F03A4A"], // rojo Ferrari
    ["#8E0A1C", "#C21730"], // rojo oscuro
    ["#E0AE00", "#FFD83A"], // amarillo
    ["#B30D26", "#E2283A"], // rojo intenso
    ["#C8102E", "#F03A4A"], // rojo Ferrari
  ];
  const flores = [
    { x: 200, y: 140, c: 0 },
    { x: 146, y: 182, c: 1 },
    { x: 256, y: 176, c: 2 },
    { x: 104, y: 244, c: 3 },
    { x: 298, y: 238, c: 1 },
    { x: 168, y: 252, c: 4 },
    { x: 236, y: 258, c: 0 },
  ];
  const stems = document.getElementById("stems");
  const heads = document.getElementById("heads");

  flores.forEach((f, i) => {
    const d = (0.15 * i).toFixed(2) + "s";
    const cx = (f.x + base.x) / 2 + (f.x - base.x) * 0.15;
    const stem = document.createElementNS(NS, "path");
    stem.setAttribute("d", `M${base.x} ${base.y} Q${cx} ${(f.y + base.y) / 2} ${f.x} ${f.y}`);
    stem.setAttribute("class", "stem");
    stem.style.setProperty("--d", d);
    stems.appendChild(stem);

    if (i % 2 === 1) {
      const lx = (f.x + base.x) / 2, ly = (f.y + base.y) / 2 + 30;
      const dir = f.x < base.x ? -1 : 1;
      const leaf = document.createElementNS(NS, "path");
      leaf.setAttribute("d", `M${lx} ${ly} C${lx + dir * 30} ${ly - 20} ${lx + dir * 34} ${ly - 60} ${lx + dir * 14} ${ly - 78} C${lx + dir * 16} ${ly - 46} ${lx + dir * 6} ${ly - 20} ${lx} ${ly} Z`);
      leaf.setAttribute("class", "leaf");
      leaf.style.setProperty("--d", d);
      stems.appendChild(leaf);
    }

    const [dark, light] = colores[f.c];
    const g = document.createElementNS(NS, "g");
    g.setAttribute("transform", `translate(${f.x} ${f.y + 4})`);
    const inner = document.createElementNS(NS, "g");
    inner.setAttribute("class", "head");
    inner.style.setProperty("--d", d);
    const stroke = false ? ' stroke="#D9CFC2" stroke-width="1.2"' : "";
    inner.innerHTML = `
      <path d="M-19 0 C-22 -20 -13 -40 0 -44 C13 -40 22 -20 19 0 C10 9 -10 9 -19 0 Z" fill="${dark}"${stroke}/>
      <path d="M-19 0 C-23 -18 -17 -36 -7 -40 C-3 -26 -2 -10 0 6 C-8 8 -14 5 -19 0 Z" fill="${dark}"${stroke}/>
      <path d="M19 0 C23 -18 17 -36 7 -40 C3 -26 2 -10 0 6 C8 8 14 5 19 0 Z" fill="${dark}"${stroke}/>
      <path d="M-11 3 C-13 -16 -7 -33 0 -38 C7 -33 13 -16 11 3 C5 9 -5 9 -11 3 Z" fill="${light}"${stroke}/>
      <path d="M-5 -6 C-6 -16 -3 -26 0 -30" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>`;
    g.appendChild(inner);
    heads.appendChild(g);
  });

  // Secuencia de salida
  const go = document.getElementById("go");
  const pods = [...document.querySelectorAll(".pod")];
  const status = document.getElementById("status");
  const start = document.getElementById("start");
  const stage = document.getElementById("stage");
  const bouquet = document.getElementById("bouquet");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? 0 : ms));

  go.addEventListener("click", async () => {
    go.disabled = true;
    go.style.visibility = "hidden";
    status.textContent = "Atenta…";
    for (const pod of pods) { await wait(700); pod.classList.add("on"); }
    await wait(900 + Math.random() * 900);
    pods.forEach(p => p.classList.remove("on"));
    status.textContent = "¡Luces fuera!";
    document.getElementById("car").classList.add("go-car");
    await wait(700);
    start.classList.add("leaving");
    await wait(400);
    start.hidden = true;
    stage.classList.add("show");
    stage.setAttribute("aria-hidden", "false");
    setTimeout(() => bouquet.classList.add("sway"), reduce ? 0 : 3000);
    bouquet.focus({ preventScroll: true });
  });

  // Carta
  const overlay = document.getElementById("overlay");
  const close = document.getElementById("close");
  bouquet.addEventListener("click", () => {
    overlay.classList.add("open");
    close.focus({ preventScroll: true });
  });
  const cerrar = () => { overlay.classList.remove("open"); bouquet.focus({ preventScroll: true }); };
  close.addEventListener("click", cerrar);
  overlay.addEventListener("click", e => { if (e.target === overlay) cerrar(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("open")) cerrar(); });
</script>
</body>
</html>
